name: Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 権限の適用を明示的に許可する（オフの場合はplanのみ）
        type: boolean
        default: false
      pr_number:
        description: マージ前planのPR番号（空欄ならmain。メンバー定義だけのPRが対象）
        type: string
        default: ''
      pr_sha:
        description: PRを指定する場合は、そのheadの完全な40文字SHAを指定
        type: string
        default: ''

permissions:
  contents: read

# 適用途中のキャンセルによる部分反映を避ける。
# GCSのstateロックでも、ローカル操作を含む同時更新を防ぐ。
concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    name: ${{ inputs.apply && '承認後にapply' || 'plan（承認不要）' }}
    if: github.ref == 'refs/heads/main' && vars.TERRAFORM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.apply && 'production' || 'plan' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AQUA_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 手動起動した実行のコミットを固定する。
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: PRへの適用を禁止
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          APPLY_REQUESTED: ${{ inputs.apply }}
        run: |
          if [[ -n "$PR_NUMBER" && "$APPLY_REQUESTED" == "true" ]]; then
            echo '::error::PRはplanのみ実行できます。applyをオフにしてください。'
            exit 1
          fi
          if [[ -z "$PR_NUMBER" && -n "$PR_SHA" ]]; then
            echo '::error::SHAを指定する場合はPR番号も必要です。'
            exit 1
          fi
      - name: 設定を検証
        run: |
          uv run --locked python scripts/validate.py
          terraform fmt -check -recursive terraform
      - name: 実行対象が現在のmainであることを確認
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$REQUESTED_SHA" != "$latest_sha" ]]; then
            echo '::error::起動後にmainが更新されました。最新のmainから新しく実行してください。'
            exit 1
          fi
      - name: PRのメンバー定義だけを取得・検証
        if: inputs.pr_number != ''
        id: pr-input
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
        run: uv run --locked python scripts/prepare_pr_plan.py --pr-number "$PR_NUMBER" --expected-sha "$PR_SHA"
      - name: 認証設定を確認
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GITHUB_APP_ID: ${{ vars.GH_APP_ID }}
          GITHUB_APP_PEM_FILE: ${{ secrets.GH_APP_PRIVATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for setting in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GITHUB_APP_ID GITHUB_APP_PEM_FILE DISCORD_BOT_TOKEN; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::必要な設定がありません: $setting"
              exit 1
            fi
          done
      - name: 差分の投稿先PRを確認
        id: comment-target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr_number="$PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | .[0].number // 0')"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          if [[ "$pr_number" == "0" ]]; then
            echo '対応するマージ済みPRがないため、差分は実行サマリーに表示します。'
          else
            echo "差分の投稿先: PR #$pr_number"
          fi
      - name: OIDCでGoogle Cloudに認証
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: GCSのstateを初期化
        run: terraform -chdir=terraform init -input=false -lockfile=readonly
      - name: Terraform構成を検証
        run: terraform -chdir=terraform validate
      - name: Organization Appの短期トークンを発行
        id: github-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: Lumos-Programming
          permission-members: ${{ inputs.apply && 'write' || 'read' }}
      - name: tfcmtでplanの差分を投稿
        env:
          GITHUB_TOKEN: ${{ steps.github-app.outputs.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TFCMT_GITHUB_TOKEN: ${{ github.token }}
          TFCMT_PR_NUMBER: ${{ steps.comment-target.outputs.pr_number }}
          TFCMT_SHA: ${{ steps.pr-input.outputs.head_sha || github.sha }}
          PR_MEMBERS_PATH: ${{ steps.pr-input.outputs.members_path }}
        run: |
          comment_options=()
          plan_options=()
          if [[ -n "$PR_MEMBERS_PATH" ]]; then
            plan_options+=("-var=members_path=$PR_MEMBERS_PATH")
          fi
          if [[ "$TFCMT_PR_NUMBER" == "0" ]]; then
            comment_options+=(--output "$GITHUB_STEP_SUMMARY")
          fi
          tfcmt "${comment_options[@]}" plan --patch -- \
            terraform -chdir=terraform plan -no-color -input=false -lock-timeout=5m -out=roles.tfplan "${plan_options[@]}"
      - name: 保存したplanを適用しtfcmtで結果を投稿
        if: inputs.apply && inputs.pr_number == ''
        env:
          GITHUB_TOKEN: ${{ steps.github-app.outputs.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TFCMT_GITHUB_TOKEN: ${{ github.token }}
          TFCMT_PR_NUMBER: ${{ steps.comment-target.outputs.pr_number }}
          TFCMT_SHA: ${{ github.sha }}
        run: |
          comment_options=()
          if [[ "$TFCMT_PR_NUMBER" == "0" ]]; then
            comment_options+=(--output "$GITHUB_STEP_SUMMARY")
          fi
          tfcmt "${comment_options[@]}" apply -- \
            terraform -chdir=terraform apply -no-color -input=false -lock-timeout=5m roles.tfplan
      - name: 実行結果を記録
        env:
          APPLY_REQUESTED: ${{ inputs.apply }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ steps.pr-input.outputs.head_sha }}
        run: |
          {
            echo '## Lusyの権限反映結果'
            echo "対象コミット: $(git rev-parse HEAD)"
            echo "メンバー定義のPR: ${PR_NUMBER:-main} $PR_SHA"
            echo "適用実行: $APPLY_REQUESTED"
          } >> "$GITHUB_STEP_SUMMARY"
